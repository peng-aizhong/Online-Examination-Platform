spring.application.name=examination-platform

# Server Configuration
server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/exam_system?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Disable demo/test data seeding by default
app.seed.enabled=false

# JWT Configuration
jwt.secret=examination-platform-secret-key-2024-this-is-a-very-long-secret-key-for-hs512-algorithm-support
jwt.expiration=86400000

# Static Resources
spring.web.resources.static-locations=classpath:/static/

# File Upload Configuration
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
app.upload.dir=uploads/

# Logging
logging.level.root=WARN
logging.level.com.examination=INFO
