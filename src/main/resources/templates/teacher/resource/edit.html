<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑学习资源 - 考试系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .edit-card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
        }
        
        .current-file {
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            background-color: #f8f9fa;
        }
        
        .file-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: white;
            margin-right: 15px;
        }
        
        .file-type-pdf { background: #dc3545; }
        .file-type-doc { background: #007bff; }
        .file-type-ppt { background: #fd7e14; }
        .file-type-video { background: #6f42c1; }
        .file-type-audio { background: #20c997; }
        .file-type-other { background: #6c757d; }
        
        .cover-preview {
            text-align: center;
            margin-top: 15px;
        }
        
        .cover-preview img {
            max-width: 300px;
            max-height: 200px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .cover-upload-area {
            border: 2px dashed #dee2e6;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            background-color: #f8f9fa;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .cover-upload-area:hover {
            border-color: #007bff;
            background-color: #e3f2fd;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container-fluid">
        <!-- 顶部操作栏 -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h2><i class="fas fa-edit me-2"></i>编辑学习资源</h2>
                        <p class="text-muted">修改资源信息和文件</p>
                    </div>
                    <div>
                        <a href="/teacher/resources" class="btn btn-outline-secondary">
                            <i class="fas fa-arrow-left me-2"></i>返回资源列表
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <form method="post" th:action="@{/teacher/resources/{id}(id=${resource.id})}" enctype="multipart/form-data">
            <div class="row">
                <div class="col-12">
                    <div class="edit-card">
                        <!-- 当前文件信息 -->
                        <h5 class="mb-3">
                            <i class="fas fa-file me-2"></i>当前文件
                        </h5>
                        
                        <div class="current-file">
                            <div class="d-flex align-items-center">
                                <div class="file-icon" 
                                     th:class="${resource.type == 'pdf' ? 'file-type-pdf' : 
                                               resource.type == 'doc' ? 'file-type-doc' : 
                                               resource.type == 'ppt' ? 'file-type-ppt' : 
                                               resource.type == 'video' ? 'file-type-video' : 
                                               resource.type == 'audio' ? 'file-type-audio' : 'file-type-other'}">
                                    <i th:class="${resource.type == 'pdf' ? 'fas fa-file-pdf' : 
                                                 resource.type == 'doc' ? 'fas fa-file-word' : 
                                                 resource.type == 'ppt' ? 'fas fa-file-powerpoint' : 
                                                 resource.type == 'video' ? 'fas fa-file-video' : 
                                                 resource.type == 'audio' ? 'fas fa-file-audio' : 'fas fa-file'}"></i>
                                </div>
                                <div class="flex-grow-1">
                                    <h6 class="mb-1" th:text="${resource.filePath != null and resource.filePath != '' ? resource.filePath : (resource.fileSize != null and resource.fileSize > 0 ? '文件已上传' : '无文件')}">文件名</h6>
                                    <small class="text-muted">
                                        <i class="fas fa-hdd me-1"></i>
                                        <span th:text="${resource.fileSize != null ? resource.fileSize + ' KB' : '未知'}">文件大小</span>
                                        <span class="ms-3">
                                            <i class="fas fa-calendar me-1"></i>
                                            <span th:text="${#temporals.format(resource.uploadTime, 'yyyy-MM-dd HH:mm')}">上传时间</span>
                                        </span>
                                    </small>
                                </div>
                                <div>
                                    <a th:href="@{/teacher/resources/{id}/download(id=${resource.id})}" 
                                       class="btn btn-outline-primary btn-sm">
                                        <i class="fas fa-download me-1"></i>下载
                                    </a>
                                </div>
                            </div>
                        </div>
                        
                        <div class="mt-3">
                            <label class="form-label">更换文件（可选）</label>
                            <input type="file" name="newFile" class="form-control" 
                                   accept="*/*">
                            <small class="text-muted">如果不选择新文件，将保持当前文件不变</small>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-12">
                    <div class="edit-card">
                        <!-- 资源信息 -->
                        <h5 class="mb-3">
                            <i class="fas fa-info-circle me-2"></i>资源信息
                        </h5>
                        
                        <div class="row mb-3">
                            <div class="col-md-8">
                                <label class="form-label">资源标题</label>
                                <input type="text" name="title" class="form-control" required 
                                       th:value="${resource.title}" placeholder="请输入资源标题">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">资源分类</label>
                                <select name="category" class="form-select" required>
                                    <option value="">请选择分类</option>
                                    <option value="lecture" th:selected="${resource.category == 'lecture'}">课件</option>
                                    <option value="exercise" th:selected="${resource.category == 'exercise'}">练习题</option>
                                    <option value="reference" th:selected="${resource.category == 'reference'}">参考资料</option>
                                    <option value="video" th:selected="${resource.category == 'video'}">视频教程</option>
                                    <option value="other" th:selected="${resource.category == 'other'}">其他</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">适用科目</label>
                                <select name="subjectId" class="form-select" required>
                                    <option value="">请选择科目</option>
                                    <option th:each="subject : ${subjects}" 
                                            th:value="${subject.subjectId}" 
                                            th:text="${subject.subjectName}"
                                            th:selected="${subject.subjectId == resource.subjectId}">
                                        科目名称
                                    </option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">资源状态</label>
                                <select name="status" class="form-select" required>
                                    <option value="ACTIVE" th:selected="${resource.status == 'ACTIVE'}">已发布</option>
                                    <option value="DRAFT" th:selected="${resource.status == 'DRAFT'}">草稿</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">资源描述</label>
                            <textarea name="description" class="form-control" rows="4" 
                                      th:text="${resource.description}"
                                      placeholder="请输入资源描述，帮助学生了解资源内容"></textarea>
                        </div>
                        
                        <!-- 封面图片编辑 -->
                        <div class="mb-3">
                            <label class="form-label">封面图片</label>
                            
                            <!-- 当前封面显示 -->
                            <div th:if="${resource.coverPath != null and resource.coverPath != ''}" class="cover-preview">
                                <img th:src="${resource.coverPath.startsWith('covers/') ? '/covers/' + #strings.substringAfter(resource.coverPath, 'covers/') : '/covers/' + resource.coverPath}" 
                                     alt="当前封面" class="img-fluid rounded">
                                <div class="mt-2">
                                    <small class="text-muted">当前封面</small>
                                </div>
                            </div>
                            
                            <!-- 封面上传区域 -->
                            <div class="cover-upload-area" id="coverUploadArea">
                                <i class="fas fa-image fa-2x text-muted mb-2"></i>
                                <h6 class="text-muted">点击更换封面图片</h6>
                                <p class="text-muted mb-3">支持 JPG、PNG、GIF 格式，建议尺寸 16:9</p>
                                <input type="file" name="coverFile" id="coverInput" class="d-none" accept=".jpg,.jpeg,.png,.gif">
                                <button type="button" class="btn btn-outline-primary btn-sm" onclick="document.getElementById('coverInput').click()">
                                    <i class="fas fa-upload me-2"></i>选择新封面
                                </button>
                            </div>
                            
                            <!-- 新封面预览 -->
                            <div id="newCoverPreview" class="cover-preview" style="display: none;">
                                <img id="newCoverImage" src="" alt="新封面预览" class="img-fluid rounded">
                                <div class="mt-2">
                                    <small class="text-success">新封面预览</small>
                                    <button type="button" class="btn btn-outline-danger btn-sm ms-2" onclick="removeNewCover()">
                                        <i class="fas fa-times me-1"></i>取消
                                    </button>
                                </div>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">标签</label>
                            <input type="text" name="tags" class="form-control" 
                                   th:value="${resource.tags}"
                                   placeholder="请输入标签，用逗号分隔">
                            <small class="text-muted">例如：Java基础,面向对象,编程入门</small>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-12">
                    <div class="edit-card">
                        <div class="text-end">
                            <button type="button" class="btn btn-outline-secondary me-2" onclick="history.back()">
                                <i class="fas fa-times me-1"></i>取消
                            </button>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-1"></i>保存修改
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 封面图片选择处理
        document.getElementById('coverInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                showNewCoverPreview(file);
            }
        });

        // 显示新封面预览
        function showNewCoverPreview(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('newCoverImage').src = e.target.result;
                document.getElementById('newCoverPreview').style.display = 'block';
                document.getElementById('coverUploadArea').style.display = 'none';
            };
            reader.readAsDataURL(file);
        }

        // 移除新封面
        function removeNewCover() {
            document.getElementById('coverInput').value = '';
            document.getElementById('newCoverPreview').style.display = 'none';
            document.getElementById('coverUploadArea').style.display = 'block';
        }
    </script>
</body>
</html>
