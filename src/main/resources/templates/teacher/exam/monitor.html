<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>考试监控 - 考试系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .monitor-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
        }
        
        .status-badge {
            font-size: 12px;
            padding: 6px 12px;
            border-radius: 20px;
        }
        
        .progress-ring {
            width: 80px;
            height: 80px;
        }
        
        .progress-ring circle {
            fill: none;
            stroke-width: 8;
            stroke-linecap: round;
        }
        
        .progress-ring .bg {
            stroke: #e9ecef;
        }
        
        .progress-ring .progress {
            stroke: #28a745;
            stroke-dasharray: 226.2;
            stroke-dashoffset: 226.2;
            transition: stroke-dashoffset 0.5s ease;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
        
        .student-session {
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }
        
        .student-session:hover {
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
        
        .student-session.active {
            border-color: #28a745;
            background-color: #f8fff9;
        }
        
        .student-session.completed {
            border-color: #17a2b8;
            background-color: #f8f9ff;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container-fluid">
        <!-- 顶部操作栏 -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h2><i class="fas fa-eye me-2"></i>考试监控</h2>
                        <p class="text-muted">实时监控考试进度和学生学习状态</p>
                    </div>
                    <div>
                        <a href="/teacher/exams" class="btn btn-outline-secondary">
                            <i class="fas fa-arrow-left me-2"></i>返回考试管理
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- 试卷信息 -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="monitor-card">
                    <div class="row align-items-center">
                        <div class="col-md-8">
                            <h4 th:text="${paper.paperName}">试卷名称</h4>
                            <p class="text-muted mb-2" th:text="${paper.subject.subjectName}">科目名称</p>
                            <div class="d-flex align-items-center">
                                <span class="badge bg-primary me-3">
                                    <i class="fas fa-clock me-1"></i>
                                    时长: <span th:text="${paper.duration}">120</span>分钟
                                </span>
                                <span class="badge bg-success me-3">
                                    <i class="fas fa-star me-1"></i>
                                    总分: <span th:text="${paper.totalScore}">100</span>分
                                </span>
                                <span class="badge bg-info">
                                    <i class="fas fa-calendar me-1"></i>
                                    创建时间: <span th:text="${#temporals.format(paper.createdAt, 'yyyy-MM-dd')}">2024-01-01</span>
                                </span>
                            </div>
                        </div>
                        <div class="col-md-4 text-end">
                            <div class="d-flex align-items-center justify-content-end">
                                <div class="me-3">
                                    <div class="progress-ring">
                                        <svg width="80" height="80">
                                            <circle class="bg" cx="40" cy="40" r="36"></circle>
                                            <circle class="progress" cx="40" cy="40" r="36"></circle>
                                        </svg>
                                    </div>
                                </div>
                                <div>
                                    <h5 class="mb-1">完成率</h5>
                                    <p class="text-muted mb-0" th:text="${#numbers.formatDecimal(completionRate, 1, 1)} + '%'">0%</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 统计信息 -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="monitor-card text-center">
                    <i class="fas fa-users fa-2x text-primary mb-2"></i>
                    <h4 class="mb-1" th:text="${totalCount}">0</h4>
                    <p class="text-muted mb-0">总参与人数</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="monitor-card text-center">
                    <i class="fas fa-play fa-2x text-warning mb-2"></i>
                    <h4 class="mb-1" th:text="${ongoingCount}">0</h4>
                    <p class="text-muted mb-0">进行中</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="monitor-card text-center">
                    <i class="fas fa-check fa-2x text-success mb-2"></i>
                    <h4 class="mb-1" th:text="${completedCount}">0</h4>
                    <p class="text-muted mb-0">已完成</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="monitor-card text-center">
                    <i class="fas fa-clock fa-2x text-info mb-2"></i>
                    <h4 class="mb-1" th:text="${notStartedCount}">0</h4>
                    <p class="text-muted mb-0">未开始</p>
                </div>
            </div>
        </div>

        <!-- 学生考试会话列表 -->
        <div class="row">
            <div class="col-12">
                <div class="monitor-card">
                    <h5 class="mb-3">
                        <i class="fas fa-list me-2"></i>学生考试状态
                    </h5>
                    
                    <div th:if="${#lists.isEmpty(sessions)}" class="text-center py-5">
                        <i class="fas fa-users fa-3x text-muted mb-3"></i>
                        <h5 class="text-muted">暂无考试会话</h5>
                        <p class="text-muted">当前没有学生参与此试卷的考试</p>
                    </div>
                    
                    <div th:if="${!sessions.isEmpty()}">
                        <div th:each="examSession : ${sessions}" class="student-session" 
                             th:classappend="${examSession.status == 'ongoing' ? 'active' : (examSession.status == 'submitted' ? 'completed' : '')}">
                            <div class="row align-items-center">
                                <div class="col-md-4">
                                    <h6 class="mb-1" th:text="${examSession.student != null ? examSession.student.username : '未知学生'}">学生姓名</h6>
                                    <p class="text-muted mb-0" th:text="${examSession.student != null ? examSession.student.email : '未知邮箱'}">学生邮箱</p>
                                </div>
                                <div class="col-md-3">
                                    <span class="badge status-badge" 
                                          th:classappend="${examSession.status == 'ongoing' ? 'bg-warning' : (examSession.status == 'submitted' ? 'bg-success' : 'bg-info')}"
                                          th:text="${examSession.statusDisplayName}">状态</span>
                                    <br>
                                    <small class="text-muted">
                                        开始时间: <span th:text="${examSession.startedAt != null ? #temporals.format(examSession.startedAt, 'HH:mm') : '未开始'}">14:00</span>
                                    </small>
                                </div>
                                <div class="col-md-3">
                                    <div th:if="${examSession.status == 'ongoing'}">
                                        <div class="progress mb-1" style="height: 6px;">
                                            <div class="progress-bar" role="progressbar" style="width: 50%"></div>
                                        </div>
                                        <small class="text-muted">
                                            考试进行中
                                        </small>
                                        <br>
                                        <small class="text-muted">
                                            考试时长: <span th:text="${examSession.durationMinutes}">120</span>分钟
                                        </small>
                                    </div>
                                    <div th:if="${examSession.status == 'submitted'}">
                                        <small class="text-muted">
                                            完成时间: <span th:text="${#temporals.format(examSession.submittedAt, 'HH:mm')}">16:00</span>
                                        </small>
                                        <br>
                                        <small class="text-success">
                                            得分: <span th:text="${examSession.totalScore != null ? examSession.totalScore : '未评分'}">85</span>分
                                        </small>
                                    </div>
                                    <div th:if="${examSession.status == '未开始'}">
                                        <small class="text-muted">等待开始</small>
                                    </div>
                                </div>
                                <div class="col-md-2 text-end">
                                    <a th:href="@{/teacher/grading/{sessionId}(sessionId=${examSession.sessionId})}" 
                                       class="btn btn-outline-primary btn-sm">
                                        <i class="fas fa-eye me-1"></i>查看详情
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 更新进度环
        function updateProgressRing(percentage) {
            const circle = document.querySelector('.progress-ring .progress');
            const circumference = 2 * Math.PI * 36; // r=36
            const offset = circumference - (percentage / 100) * circumference;
            circle.style.strokeDashoffset = offset;
        }

        // 初始化进度环
        document.addEventListener('DOMContentLoaded', function() {
            const completionRate = /*[[${completionRate}]]*/ 0;
            updateProgressRing(completionRate);
        });

        // 模拟实时更新（实际项目中会通过WebSocket或轮询实现）
        setInterval(function() {
            // 这里可以添加实时数据更新逻辑
        }, 5000);
    </script>
</body>
</html>
