<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>题库管理 - 考试系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container-fluid py-4">
        <!-- 页面标题 -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="d-flex align-items-center">
                    <i class="fas fa-question-circle text-primary me-3" style="font-size: 2rem;"></i>
                    <div>
                        <h2 class="mb-1">题库管理</h2>
                        <p class="text-muted mb-0">管理所有题目，支持导入、编辑、删除和搜索功能</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 统计卡片 -->
        <div class="row mb-4">
            <div class="col-md-3 mb-3">
                <div class="card">
                    <div class="card-body text-center">
                        <i class="fas fa-list-ul text-primary" style="font-size: 2rem;"></i>
                        <div class="h3 mt-2" id="totalQuestions">0</div>
                        <div class="text-muted">题目总数</div>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card">
                    <div class="card-body text-center">
                        <i class="fas fa-check-circle text-success" style="font-size: 2rem;"></i>
                        <div class="h3 mt-2" id="enabledQuestions">0</div>
                        <div class="text-muted">启用题目</div>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card">
                    <div class="card-body text-center">
                        <i class="fas fa-exclamation-triangle text-warning" style="font-size: 2rem;"></i>
                        <div class="h3 mt-2" id="pendingQuestions">0</div>
                        <div class="text-muted">待审核</div>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card">
                    <div class="card-body text-center">
                        <i class="fas fa-tags text-info" style="font-size: 2rem;"></i>
                        <div class="h3 mt-2" id="knowledgeTags">0</div>
                        <div class="text-muted">知识点标签</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 操作按钮 -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-2 mb-3">
                                <a href="/teacher/questions/add" class="btn btn-primary w-100">
                                    <i class="fas fa-plus me-2"></i>新增题目
                                </a>
                            </div>
                            <div class="col-md-2 mb-3">
                                <button type="button" class="btn btn-success w-100" id="importQuestions">
                                    <i class="fas fa-upload me-2"></i>导入题目
                                </button>
                            </div>
                            <div class="col-md-2 mb-3">
                                <button type="button" class="btn btn-info w-100" id="exportQuestions">
                                    <i class="fas fa-download me-2"></i>导出题目
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 题目列表 -->
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">题目列表</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>编号</th>
                                <th>题目内容</th>
                                <th>类型</th>
                                <th>难度</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="question : ${questions}">
                                <td th:text="${question.id}">-</td>
                                <td>
                                    <div class="text-truncate" style="max-width: 300px;" 
                                         th:text="${question.content}">-</div>
                                </td>
                                <td>
                                    <span class="badge bg-secondary" 
                                          th:text="${question.questionType == 'C' ? '选择题' : 
                                                     question.questionType == 'F' ? '填空题' : 
                                                     question.questionType == 'R' ? '判断题' : 
                                                     question.questionType == 'S' ? '简答题' : '编程题'}">-</span>
                                </td>
                                <td>
                                    <span class="badge bg-info" 
                                          th:text="${question.difficulty == 'easy' ? '简单' : 
                                                     question.difficulty == 'medium' ? '中等' : '困难'}">-</span>
                                </td>
                                <td>
                                    <span class="badge" 
                                          th:classappend="${question.status == '启用' ? 'bg-success' : 
                                                          question.status == '待审核' ? 'bg-warning' : 'bg-danger'}"
                                          th:text="${question.status}">-</span>
                                </td>
                                <td>
                                    <div class="btn-group btn-group-sm">
                                        <a th:href="@{/teacher/questions/{id}/edit(id=${question.id})}" 
                                           class="btn btn-outline-primary btn-sm">
                                            <i class="fas fa-edit"></i>
                                        </a>
                                        <button type="button" class="btn btn-outline-danger btn-sm" 
                                                th:data-question-id="${question.id}"
                                                onclick="deleteQuestion(this.dataset.questionId)">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(questions)}">
                                <td colspan="6" class="text-center text-muted py-4">
                                    <i class="fas fa-inbox fa-2x mb-3"></i>
                                    <p>暂无题目数据</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            // 加载统计信息
            loadStatistics();
            
            // 导入题目按钮
            $('#importQuestions').click(function() {
                alert('导入功能开发中...');
            });
            
            // 导出题目按钮
            $('#exportQuestions').click(function() {
                alert('导出功能开发中...');
            });
        });

        // 加载统计信息
        function loadStatistics() {
            $.ajax({
                url: '/teacher/questions/statistics',
                method: 'GET',
                success: function(data) {
                    $('#totalQuestions').text(data.totalCount || 0);
                    $('#enabledQuestions').text(data.enabledCount || 0);
                    $('#pendingQuestions').text(data.pendingCount || 0);
                    $('#knowledgeTags').text(data.knowledgeTagCount || 0);
                },
                error: function() {
                    console.log('获取统计信息失败');
                }
            });
        }

        // 删除题目
        function deleteQuestion(questionId) {
            if (confirm('确定要删除这道题目吗？此操作不可恢复。')) {
                $.ajax({
                    url: '/teacher/questions/' + questionId + '/delete',
                    method: 'POST',
                    success: function(response) {
                        if (response.success) {
                            alert('删除成功！');
                            location.reload();
                        } else {
                            alert('删除失败：' + response.message);
                        }
                    },
                    error: function() {
                        alert('删除失败，请稍后重试');
                    }
                });
            }
        }
    </script>
</body>
</html>
