<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>考试系统 - 登录注册</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* 背景动画效果 */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="50" cy="50" r="1" fill="rgba(255,255,255,0.1)"/></pattern></defs><rect width="100" height="100" fill="url(%23grain)"/></svg>');
            opacity: 0.3;
            animation: float 20s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        .container {
            width: 100%;
            max-width: 1200px;
            position: relative;
            z-index: 1;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            display: flex;
            min-height: 700px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: slideInUp 0.8s ease-out;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .welcome-section {
            flex: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 60px 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .welcome-section::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .welcome-icon {
            font-size: 100px;
            margin-bottom: 30px;
            opacity: 0.9;
            animation: bounce 2s ease-in-out infinite;
            position: relative;
            z-index: 1;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        .welcome-title {
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 15px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            position: relative;
            z-index: 1;
        }

        .welcome-subtitle {
            font-size: 20px;
            opacity: 0.9;
            line-height: 1.6;
            position: relative;
            z-index: 1;
        }

        .form-section {
            flex: 1;
            padding: 60px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: white;
        }

        .toggle-buttons {
            display: flex;
            margin-bottom: 40px;
            background: #f8f9fa;
            border-radius: 15px;
            padding: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .toggle-btn {
            flex: 1;
            padding: 15px 25px;
            border: none;
            background: transparent;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            color: #6c757d;
            position: relative;
            overflow: hidden;
        }

        .toggle-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: left 0.5s;
        }

        .toggle-btn:hover::before {
            left: 100%;
        }

        .toggle-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
            transform: translateY(-2px);
        }

        .toggle-btn:hover:not(.active) {
            background: #e9ecef;
            color: #495057;
            transform: translateY(-1px);
        }

        .form-title {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 40px;
            color: #2c3e50;
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .form-container {
            display: none;
            animation: fadeInUp 0.6s ease-out;
        }

        .form-container.active {
            display: block;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #495057;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .form-control {
            width: 100%;
            padding: 18px 20px;
            border: 2px solid #e9ecef;
            border-radius: 15px;
            font-size: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-sizing: border-box;
            background: #f8f9fa;
            position: relative;
        }

        .form-control:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
            background: white;
            transform: translateY(-2px);
        }

        .form-control:hover {
            border-color: #667eea;
            transform: translateY(-1px);
        }

        .form-select {
            width: 100%;
            padding: 18px 20px;
            border: 2px solid #e9ecef;
            border-radius: 15px;
            font-size: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: #f8f9fa;
            cursor: pointer;
        }

        .form-select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
            background: white;
        }

        .btn {
            width: 100%;
            padding: 18px 25px;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 30px;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:active {
            transform: translateY(-1px);
        }

        .form-check {
            display: flex;
            align-items: center;
            margin: 25px 0;
        }

        .form-check-input {
            margin-right: 12px;
            transform: scale(1.3);
            accent-color: #667eea;
        }

        .form-check-label {
            color: #6c757d;
            font-size: 15px;
            font-weight: 500;
        }

        .password-strength {
            margin-top: 8px;
            font-size: 13px;
            font-weight: 600;
            padding: 8px 12px;
            border-radius: 8px;
            text-align: center;
        }

        .text-danger {
            color: #dc3545 !important;
            background: rgba(220, 53, 69, 0.1);
        }

        .text-warning {
            color: #ffc107 !important;
            background: rgba(255, 193, 7, 0.1);
        }

        .text-success {
            color: #28a745 !important;
            background: rgba(40, 167, 69, 0.1);
        }

        .alert {
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 15px;
            border: none;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            animation: slideInRight 0.5s ease-out;
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .alert-success {
            background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
            color: #155724;
        }

        .alert-danger {
            background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
            color: #721c24;
        }

        .alert-info {
            background: linear-gradient(135deg, #d1ecf1 0%, #bee5eb 100%);
            color: #0c5460;
        }

        .alert-warning {
            background: linear-gradient(135deg, #fff3cd 0%, #ffeaa7 100%);
            color: #856404;
        }

        /* 输入框图标 */
        .input-group {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #6c757d;
            font-size: 18px;
            transition: all 0.3s ease;
            z-index: 2;
        }

        .form-control:focus + .input-icon {
            color: #667eea;
        }

        .form-control.has-icon {
            padding-left: 55px;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .auth-card {
                flex-direction: column;
                min-height: auto;
                margin: 20px;
            }
            
            .welcome-section {
                padding: 40px 30px;
            }
            
            .welcome-icon {
                font-size: 70px;
            }
            
            .welcome-title {
                font-size: 32px;
            }
            
            .form-section {
                padding: 40px 30px;
            }
            
            .container {
                padding: 0;
            }

            .form-title {
                font-size: 28px;
            }

            .btn {
                padding: 16px 20px;
                font-size: 16px;
            }
        }

        /* 加载动画 */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 浮动标签效果 */
        .floating-label {
            position: relative;
        }

        .floating-label .form-control:focus + label,
        .floating-label .form-control:not(:placeholder-shown) + label {
            transform: translateY(-25px) scale(0.85);
            color: #667eea;
        }

        .floating-label label {
            position: absolute;
            left: 20px;
            top: 18px;
            transition: all 0.3s ease;
            pointer-events: none;
            color: #6c757d;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="auth-card">
            <!-- 左侧欢迎区域 -->
            <div class="welcome-section">
                <div class="welcome-icon">
                    <i class="fas fa-graduation-cap"></i>
                </div>
                <div class="welcome-title">
                    考试系统
                </div>
                <div class="welcome-subtitle">
                    欢迎使用现代化的考试管理系统<br>
                    让学习更高效，让管理更简单
                </div>
            </div>

            <!-- 右侧表单区域 -->
            <div class="form-section">
                <!-- 切换按钮 -->
                <div class="toggle-buttons">
                    <button class="toggle-btn active" onclick="showForm('login')">
                        <i class="fas fa-sign-in-alt me-2"></i>登录
                    </button>
                    <button class="toggle-btn" onclick="showForm('register')">
                        <i class="fas fa-user-plus me-2"></i>注册
                    </button>
                </div>

                <!-- 登录表单 -->
                <div id="loginForm" class="form-container active">
                    <h3 class="form-title">欢迎回来</h3>
                    
                    <!-- 显示错误消息 -->
                    <div th:if="${error}" class="alert alert-danger">
                        <i class="fas fa-exclamation-circle me-2"></i>
                        <span th:text="${error}"></span>
                    </div>
                    
                    <!-- 显示成功消息 -->
                    <div th:if="${success}" class="alert alert-success">
                        <i class="fas fa-check-circle me-2"></i>
                        <span th:text="${success}"></span>
                    </div>
                    
                    <form th:action="@{/login}" method="post" id="loginFormElement">
                        <div class="form-group">
                            <label for="username" class="form-label">
                                <i class="fas fa-user me-2"></i>用户名
                            </label>
                            <div class="input-group">
                                <input type="text" class="form-control has-icon" id="username" name="username" 
                                       placeholder="请输入您的用户名" required>
                                <i class="fas fa-user input-icon"></i>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="password" class="form-label">
                                <i class="fas fa-lock me-2"></i>密码
                            </label>
                            <div class="input-group">
                                <input type="password" class="form-control has-icon" id="password" name="password" 
                                       placeholder="请输入您的密码" required>
                                <i class="fas fa-lock input-icon"></i>
                            </div>
                        </div>
                        
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="remember-me" name="remember-me">
                            <label class="form-check-label" for="remember-me">
                                记住我
                            </label>
                        </div>
                        
                        <button type="submit" class="btn btn-primary" id="loginBtn">
                            <span class="btn-text">
                                <i class="fas fa-sign-in-alt me-2"></i>登录
                            </span>
                            <span class="btn-loading" style="display: none;">
                                <div class="loading me-2"></div>登录中...
                            </span>
                        </button>
                    </form>
                </div>

                <!-- 注册表单 -->
                <div id="registerForm" class="form-container">
                    <h3 class="form-title">创建账户</h3>
                    
                    <form th:action="@{/register}" th:object="${user}" method="post" id="registerFormElement">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="regUsername" class="form-label">
                                        <i class="fas fa-user me-2"></i>用户名
                                    </label>
                                    <div class="input-group">
                                        <input type="text" class="form-control has-icon" id="regUsername" th:field="*{username}" 
                                               placeholder="请输入用户名" required>
                                        <i class="fas fa-user input-icon"></i>
                                    </div>
                                    <div th:if="${#fields.hasErrors('username')}" class="text-danger small mt-2">
                                        <i class="fas fa-exclamation-triangle me-1"></i>
                                        <span th:errors="*{username}"></span>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="regRole" class="form-label">
                                        <i class="fas fa-users me-2"></i>用户角色
                                    </label>
                                    <select class="form-select" id="regRole" th:field="*{role}" required>
                                        <option value="">请选择用户角色</option>
                                        <option th:each="role : ${roles}" 
                                                th:value="${role}" 
                                                th:text="${role.displayName}"></option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="regPassword" class="form-label">
                                        <i class="fas fa-lock me-2"></i>密码
                                    </label>
                                    <div class="input-group">
                                        <input type="password" class="form-control has-icon" id="regPassword" th:field="*{password}" 
                                               placeholder="请输入密码" required>
                                        <i class="fas fa-lock input-icon"></i>
                                    </div>
                                    <div class="password-strength" id="passwordStrength"></div>
                                    <div th:if="${#fields.hasErrors('password')}" class="text-danger small mt-2">
                                        <i class="fas fa-exclamation-triangle me-1"></i>
                                        <span th:errors="*{password}"></span>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="confirmPassword" class="form-label">
                                        <i class="fas fa-lock me-2"></i>确认密码
                                    </label>
                                    <div class="input-group">
                                        <input type="password" class="form-control has-icon" id="confirmPassword" 
                                               name="confirmPassword" placeholder="请再次输入密码" required>
                                        <i class="fas fa-lock input-icon"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="regEmail" class="form-label">
                                        <i class="fas fa-envelope me-2"></i>邮箱
                                    </label>
                                    <div class="input-group">
                                        <input type="email" class="form-control has-icon" id="regEmail" th:field="*{email}" 
                                               placeholder="请输入邮箱地址">
                                        <i class="fas fa-envelope input-icon"></i>
                                    </div>
                                    <div th:if="${#fields.hasErrors('email')}" class="text-danger small mt-2">
                                        <i class="fas fa-exclamation-triangle me-1"></i>
                                        <span th:errors="*{email}"></span>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="regPhone" class="form-label">
                                        <i class="fas fa-phone me-2"></i>手机号码
                                    </label>
                                    <div class="input-group">
                                        <input type="tel" class="form-control has-icon" id="regPhone" th:field="*{phone}" 
                                               placeholder="请输入手机号码">
                                        <i class="fas fa-phone input-icon"></i>
                                    </div>
                                    <div th:if="${#fields.hasErrors('phone')}" class="text-danger small mt-2">
                                        <i class="fas fa-exclamation-triangle me-1"></i>
                                        <span th:errors="*{phone}"></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="regDepartment" class="form-label">
                                <i class="fas fa-building me-2"></i>所属部门
                            </label>
                            <div class="input-group">
                                <input type="text" class="form-control has-icon" id="regDepartment" th:field="*{department}" 
                                       placeholder="请输入所属部门">
                                <i class="fas fa-building input-icon"></i>
                            </div>
                            <div th:if="${#fields.hasErrors('department')}" class="text-danger small mt-2">
                                <i class="fas fa-exclamation-triangle me-1"></i>
                                <span th:errors="*{department}"></span>
                            </div>
                        </div>
                        
                        <button type="submit" class="btn btn-primary" onclick="return validateRegisterForm()" id="registerBtn">
                            <span class="btn-text">
                                <i class="fas fa-user-plus me-2"></i>创建账户
                            </span>
                            <span class="btn-loading" style="display: none;">
                                <div class="loading me-2"></div>创建中...
                            </span>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 表单切换功能
        function showForm(formType) {
            // 隐藏所有表单
            document.querySelectorAll('.form-container').forEach(form => {
                form.classList.remove('active');
            });
            
            // 移除所有按钮的active状态
            document.querySelectorAll('.toggle-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // 显示对应表单
            if (formType === 'login') {
                document.getElementById('loginForm').classList.add('active');
                document.querySelector('.toggle-btn:first-child').classList.add('active');
            } else {
                document.getElementById('registerForm').classList.add('active');
                document.querySelector('.toggle-btn:last-child').classList.add('active');
            }
        }
        
        // 自动隐藏提示信息
        function autoHideAlerts() {
            // 自动隐藏成功提示
            const successAlert = document.querySelector('.alert-success');
            if (successAlert) {
                setTimeout(() => {
                    successAlert.style.transition = 'opacity 0.5s ease-out';
                    successAlert.style.opacity = '0';
                    setTimeout(() => {
                        successAlert.remove();
                    }, 500);
                }, 4000);
            }
            
            // 自动隐藏错误提示
            const errorAlert = document.querySelector('.alert-danger');
            if (errorAlert) {
                setTimeout(() => {
                    errorAlert.style.transition = 'opacity 0.5s ease-out';
                    errorAlert.style.opacity = '0';
                    setTimeout(() => {
                        errorAlert.remove();
                    }, 500);
                }, 6000);
            }
        }
        
        // 密码强度检查
        function checkPasswordStrength(password) {
            const strengthDiv = document.getElementById('passwordStrength');
            if (!strengthDiv) return;
            
            let strength = 0;
            let feedback = '';
            let className = '';
            
            if (password.length >= 6) strength++;
            if (password.length >= 8) strength++;
            if (/[a-z]/.test(password)) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;
            
            switch (strength) {
                case 0:
                case 1:
                    feedback = '<i class="fas fa-times-circle me-1"></i>密码强度：弱';
                    className = 'text-danger';
                    break;
                case 2:
                case 3:
                    feedback = '<i class="fas fa-exclamation-triangle me-1"></i>密码强度：中等';
                    className = 'text-warning';
                    break;
                case 4:
                case 5:
                    feedback = '<i class="fas fa-check-circle me-1"></i>密码强度：强';
                    className = 'text-success';
                    break;
                default:
                    feedback = '<i class="fas fa-star me-1"></i>密码强度：很强';
                    className = 'text-success';
            }
            
            strengthDiv.innerHTML = feedback;
            strengthDiv.className = `password-strength ${className}`;
        }
        
        // 密码确认检查
        function checkPasswordConfirm() {
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const confirmInput = document.getElementById('confirmPassword');
            
            if (confirmPassword && password !== confirmPassword) {
                confirmInput.setCustomValidity('两次输入的密码不一致');
                confirmInput.style.borderColor = '#dc3545';
            } else {
                confirmInput.setCustomValidity('');
                confirmInput.style.borderColor = '#e9ecef';
            }
        }
        
        // 邮箱格式检查
        function checkEmailFormat() {
            const emailInput = document.getElementById('regEmail');
            const email = emailInput.value.trim();
            
            if (email && !isValidEmail(email)) {
                emailInput.setCustomValidity('请输入有效的邮箱地址');
                emailInput.style.borderColor = '#dc3545';
            } else {
                emailInput.setCustomValidity('');
                emailInput.style.borderColor = '#e9ecef';
            }
        }
        
        // 邮箱验证函数
        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }
        
        // 手机号格式检查
        function checkPhoneFormat() {
            const phoneInput = document.getElementById('regPhone');
            const phone = phoneInput.value.trim();
            
            if (phone && !isValidPhone(phone)) {
                phoneInput.setCustomValidity('请输入有效的手机号码');
                phoneInput.style.borderColor = '#dc3545';
            } else {
                phoneInput.setCustomValidity('');
                phoneInput.style.borderColor = '#e9ecef';
            }
        }
        
        // 手机号验证函数
        function isValidPhone(phone) {
            const phoneRegex = /^1[3-9]\d{9}$/;
            return phoneRegex.test(phone);
        }
        
        // 注册表单验证
        function validateRegisterForm() {
            const form = document.getElementById('registerFormElement');
            let isValid = true;
            
            // 验证用户名
            const usernameInput = document.getElementById('regUsername');
            if (usernameInput.value.trim().length < 2) {
                usernameInput.setCustomValidity('用户名至少需要2个字符');
                usernameInput.style.borderColor = '#dc3545';
                isValid = false;
            } else {
                usernameInput.setCustomValidity('');
                usernameInput.style.borderColor = '#e9ecef';
            }
            
            // 验证角色
            const roleInput = document.getElementById('regRole');
            if (!roleInput.value) {
                roleInput.setCustomValidity('请选择用户角色');
                roleInput.style.borderColor = '#dc3545';
                isValid = false;
            } else {
                roleInput.setCustomValidity('');
                roleInput.style.borderColor = '#e9ecef';
            }
            
            // 验证密码
            const passwordInput = document.getElementById('regPassword');
            if (passwordInput.value.length < 6) {
                passwordInput.setCustomValidity('密码至少需要6个字符');
                passwordInput.style.borderColor = '#dc3545';
                isValid = false;
            } else {
                passwordInput.setCustomValidity('');
                passwordInput.style.borderColor = '#e9ecef';
            }
            
            // 验证确认密码
            const confirmPasswordInput = document.getElementById('confirmPassword');
            if (confirmPasswordInput.value !== passwordInput.value) {
                confirmPasswordInput.setCustomValidity('两次输入的密码不一致');
                confirmPasswordInput.style.borderColor = '#dc3545';
                isValid = false;
            } else {
                confirmPasswordInput.setCustomValidity('');
                confirmPasswordInput.style.borderColor = '#e9ecef';
            }
            
            // 验证邮箱格式（如果填写）
            const emailInput = document.getElementById('regEmail');
            if (emailInput.value.trim() && !isValidEmail(emailInput.value.trim())) {
                emailInput.setCustomValidity('请输入有效的邮箱地址');
                emailInput.style.borderColor = '#dc3545';
                isValid = false;
            } else {
                emailInput.setCustomValidity('');
                emailInput.style.borderColor = '#e9ecef';
            }
            
            // 验证手机号格式（如果填写）
            const phoneInput = document.getElementById('regPhone');
            if (phoneInput.value.trim() && !isValidPhone(phoneInput.value.trim())) {
                phoneInput.setCustomValidity('请输入有效的手机号码');
                phoneInput.style.borderColor = '#dc3545';
                isValid = false;
            } else {
                phoneInput.setCustomValidity('');
                phoneInput.style.borderColor = '#e9ecef';
            }
            
            if (!form.checkValidity()) {
                isValid = false;
            }
            
            if (!isValid) {
                // 显示加载状态
                const registerBtn = document.getElementById('registerBtn');
                const btnText = registerBtn.querySelector('.btn-text');
                const btnLoading = registerBtn.querySelector('.btn-loading');
                
                btnText.style.display = 'none';
                btnLoading.style.display = 'inline-block';
                
                setTimeout(() => {
                    btnText.style.display = 'inline-block';
                    btnLoading.style.display = 'none';
                }, 2000);
                
                return false;
            }
            return true;
        }
        
        // 表单提交处理
        function handleFormSubmit(formId, btnId) {
            const form = document.getElementById(formId);
            const btn = document.getElementById(btnId);
            const btnText = btn.querySelector('.btn-text');
            const btnLoading = btn.querySelector('.btn-loading');
            
            if (form) {
                form.addEventListener('submit', function() {
                    btnText.style.display = 'none';
                    btnLoading.style.display = 'inline-block';
                    btn.disabled = true;
                });
            }
        }
        
        // 页面加载完成后绑定事件
        document.addEventListener('DOMContentLoaded', function() {
            // 自动隐藏提示信息
            autoHideAlerts();
            
            // 绑定表单提交事件
            handleFormSubmit('loginFormElement', 'loginBtn');
            handleFormSubmit('registerFormElement', 'registerBtn');
            
            // 密码强度检查
            const passwordInput = document.getElementById('regPassword');
            if (passwordInput) {
                passwordInput.addEventListener('input', function() {
                    checkPasswordStrength(this.value);
                });
            }
            
            // 密码确认检查
            const confirmPasswordInput = document.getElementById('confirmPassword');
            if (confirmPasswordInput) {
                confirmPasswordInput.addEventListener('input', checkPasswordConfirm);
            }
            
            // 邮箱格式检查
            const emailInput = document.getElementById('regEmail');
            if (emailInput) {
                emailInput.addEventListener('input', checkEmailFormat);
            }
            
            // 手机号格式检查
            const phoneInput = document.getElementById('regPhone');
            if (phoneInput) {
                phoneInput.addEventListener('input', checkPhoneFormat);
            }
            
            // 添加输入框焦点效果
            document.querySelectorAll('.form-control').forEach(input => {
                input.addEventListener('focus', function() {
                    this.parentElement.style.transform = 'scale(1.02)';
                });
                
                input.addEventListener('blur', function() {
                    this.parentElement.style.transform = 'scale(1)';
                });
            });
        });
    </script>
</body>
