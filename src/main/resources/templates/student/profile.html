<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人设置 - 考试系统</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .sidebar {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .sidebar .nav-link {
            color: rgba(255, 255, 255, 0.8);
            border-radius: 10px;
            margin: 5px 0;
            transition: all 0.3s;
        }
        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            color: white;
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(5px);
        }
        .main-content {
            background-color: #f8f9fa;
            min-height: 100vh;
        }
        .profile-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        .avatar-section {
            text-align: center;
            padding: 2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px 15px 0 0;
        }
        .avatar-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid white;
            object-fit: cover;
        }
        .info-section {
            padding: 2rem;
        }
        .info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
            border-bottom: 1px solid #eee;
        }
        .info-item:last-child {
            border-bottom: none;
        }
        .info-label {
            font-weight: 600;
            color: #495057;
        }
        .info-value {
            color: #6c757d;
        }
        .btn-edit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 25px;
            padding: 0.5rem 2rem;
            color: white;
            transition: all 0.3s;
        }
        .btn-edit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
            color: white;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- 侧边栏 -->
            <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse">
                <div class="position-sticky pt-3">
                    <div class="text-center mb-4">
                        <h4 class="text-white">考试系统</h4>
                        <small class="text-white-50">学生面板</small>
                    </div>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link" href="/student">
                                <i class="bi bi-house-door me-2"></i>
                                控制台
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/student/exams">
                                <i class="bi bi-journal-text me-2"></i>
                                参加考试
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/student/exams/history">
                                <i class="bi bi-clock-history me-2"></i>
                                考试记录
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/student/exams/history">
                                <i class="bi bi-trophy me-2"></i>
                                成绩查看
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/student/resources">
                                <i class="bi bi-book me-2"></i>
                                学习资源
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="/student/profile">
                                <i class="bi bi-person-gear me-2"></i>
                                个人设置
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- 主内容区 -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">个人设置</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <div class="btn-group me-2">
                            <button type="button" class="btn btn-outline-secondary" onclick="history.back()">
                                <i class="bi bi-arrow-left me-1"></i>
                                返回
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 个人资料卡片 -->
                <div class="row">
                    <div class="col-lg-8 mx-auto">
                        <div class="card profile-card">
                            <div class="avatar-section">
                                <img th:src="${user.avatar != null ? '/uploads/avatars/' + user.avatar : '/images/default-avatar.svg'}" 
                                     alt="头像" class="avatar-img mb-3">
                                <h4 th:text="${user.username}">学生姓名</h4>
                                <p class="mb-0">学生用户</p>
                            </div>
                            <div class="info-section">
                                <div class="info-item">
                                    <span class="info-label">用户ID</span>
                                    <span class="info-value" th:text="${user.userId}">ST001</span>
                                </div>
                                <div class="info-item">
                                    <span class="info-label">用户名</span>
                                    <span class="info-value" th:text="${user.username}">student</span>
                                </div>
                                <div class="info-item">
                                    <span class="info-label">邮箱</span>
                                    <span class="info-value" th:text="${user.email != null ? user.email : '未设置'}">student@example.com</span>
                                </div>
                                <div class="info-item">
                                    <span class="info-label">手机号</span>
                                    <span class="info-value" th:text="${user.phone != null ? user.phone : '未设置'}">13800138000</span>
                                </div>
                                <div class="info-item">
                                    <span class="info-label">部门</span>
                                    <span class="info-value" th:text="${user.department != null ? user.department : '未设置'}">计算机学院</span>
                                </div>
                                <div class="info-item">
                                    <span class="info-label">注册时间</span>
                                    <span class="info-value" th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm')}">2024-01-01 10:00</span>
                                </div>
                                <div class="info-item">
                                    <span class="info-label">最后更新</span>
                                    <span class="info-value" th:text="${#temporals.format(user.updatedAt, 'yyyy-MM-dd HH:mm')}">2024-01-01 10:00</span>
                                </div>
                                <div class="text-center mt-4">
                                    <button type="button" class="btn btn-edit" data-bs-toggle="modal" data-bs-target="#editProfileModal">
                                        <i class="bi bi-pencil me-2"></i>
                                        编辑资料
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- 编辑资料模态框 -->
    <div class="modal fade" id="editProfileModal" tabindex="-1" aria-labelledby="editProfileModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editProfileModalLabel">编辑个人资料</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form th:action="@{/student/profile/update}" method="post" enctype="multipart/form-data">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="email" class="form-label">邮箱</label>
                            <input type="email" class="form-control" id="email" name="email" th:value="${user.email}">
                        </div>
                        <div class="mb-3">
                            <label for="phone" class="form-label">手机号</label>
                            <input type="tel" class="form-control" id="phone" name="phone" th:value="${user.phone}">
                        </div>
                        <div class="mb-3">
                            <label for="department" class="form-label">部门</label>
                            <input type="text" class="form-control" id="department" name="department" th:value="${user.department}">
                        </div>
                        <div class="mb-3">
                            <label for="avatar" class="form-label">头像</label>
                            <input type="file" class="form-control" id="avatar" name="avatar" accept="image/*">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                        <button type="submit" class="btn btn-primary">保存更改</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
